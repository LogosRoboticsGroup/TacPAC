run_id: starvla-vla
run_root_dir: playground/Checkpoints
seed: 42
trackers: [jsonl]
is_debug: false

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen2.5-VL-3B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  dino:
    dino_backbone: dinov2_vits14
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024     # TODO merge with hidden_size, in config v2
    hidden_size: 1024     
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    future_action_window_size: 47
    action_horizon: 48 # need merge with future_action_window_size 
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:    # DiT Transformer parameters
      cross_attention_dim: 2048 # VLM hidden dim
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

  reduce_in_full_precision: true

datasets:
  vla_data:
    dataset_py: vla_datasets
    include_state: false
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_goal # libero_goal
    action_type: delta_qpos
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 16
    split_strategy: episode_ratio
    eval_ratio: 0.02
    split_seed: 42
    eval_per_device_batch_size: 16
    load_all_data_for_training: true
    action_horizon: 48
    image_size: [224, 224]
    state_pad_size: 7
    action_pad_size: 7
    use_future_frames: true
    num_future_frames: 12
    future_frame_stride: 4

trainer:
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  save_format: pt  # pt or safetensors
