[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tacpac"
authors = [
    {name = "Zipei Ma"},
    {name = "Xiaofei Wei"},
    {name = "Junzhe Jiang"},
    {name = "Shunlin Lu"},
    {name = "Li Zhang"},
]
description = "TacPAC: tactile prediction and real-time action correction for contact-rich manipulation."
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["tactile sensing", "world-action models", "contact-rich manipulation", "vision-language-action", "robot learning"]
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
"Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
]

[project.optional-dependencies]
dev = [
    "black>=24.2.0",
    "gpustat",
    "ipython",
    "pre-commit",
    "ruff>=0.2.2",
]
sagemaker = [
    "boto3",
    "sagemaker"
]


[tool.setuptools.packages.find]
where = ["."]
exclude = [
    "tests",         # test directory
    "tests.*",
    "cache",         # cache directory
    "cache.*",
    "playground",    # playground directory (contains symlinks to Datasets, Models)
    "playground.*",
    "results",       # result directory
    "results.*",
    "checkpoints",   # model checkpoint
    "checkpoints.*",
    "scripts",       # script directory
    "scripts.*",
    "eval",          # evaluation related directory
    "eval.*",
    "assets",        # assets directory
    "assets.*",
    "**bar**",           # bar directory
    "bar.*",
    ".vscode",       # VS Code configuration directory
    "*.egg-info",    # egg-info metadata directory
    "**__pycache__**",   # Python cache directory
    "*.pyc",         # compiled Python file
    "*.pyo",         # optimized Python file
    "starVLA.egg-info",
    "starVLA.egg-info.*",
    "starVLA.config",
    "starVLA.config.*",
]

[tool.setuptools.package-data]
"cogact" = ["py.typed"]

[tool.black]
line-length = 121
target-version = ["py310"]
preview = true

[tool.ruff]
line-length = 121
target-version = "py310"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "RUF", "W"]
ignore = ["F722"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
